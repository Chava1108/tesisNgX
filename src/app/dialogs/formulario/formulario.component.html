<div class="dialog-container">
  <h2 class="dialog-title">
    <mat-icon style="vertical-align: middle; margin-right: 8px;">class</mat-icon>Crear Clase
  </h2>

  <div class="dialog-body">
    <div class="dialog-left">
      <!-- Crear clase -->
      <div class="section" *ngIf="bandClase">
        <form [formGroup]="formularioClase">
          <div class="field-group">
            <label class="field-label">Nombre de la clase</label>
            <input class="poo-input field-input" type="text" formControlName="nombre" (change)="classExist()">
          </div>
          <div class="field-group">
            <label class="field-label">Nivel de acceso</label>
            <select class="poo-input field-input" formControlName="nivelClase">
              <option *ngFor="let item of listNivel2" [value]="item">{{item}}</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label">Imagen</label>
            <input formControlName="imagen" accept="image/*" (change)="capturarArchivo($event)" type="file"
              class="poo-input field-input" style="padding: 6px;">
          </div>
          <button type="button" class="btn-poo btn-poo-success"
            [disabled]="formularioClase.pristine || formularioClase.invalid && !bandExistClass"
            (click)="crearClase()">
            <mat-icon style="font-size: 16px; height: 16px; width: 16px;">add</mat-icon> Crear Clase
          </button>
        </form>
      </div>

      <!-- Atributos / Funciones / Herencia -->
      <div *ngIf="!bandClase" class="section">
        <form [formGroup]="formularioAtributo">
          <label class="section-label">Atributos</label>
          <div class="inline-form">
            <select class="poo-input" formControlName="nivelAtributo" style="width: 100px;">
              <option *ngFor="let item of listNivel" [value]="item">{{item}}</option>
            </select>
            <select class="poo-input" formControlName="tipoAtributo" style="width: 100px;">
              <option *ngFor="let item of list" [value]="item">{{item}}</option>
            </select>
            <input class="poo-input" formControlName="atributo" type="text" placeholder="Nombre" style="flex: 1;">
            <button type="button" class="btn-poo btn-poo-success btn-sm"
              [disabled]="formularioAtributo.pristine || formularioAtributo.invalid"
              (click)="agregarAtributo()">Agregar</button>
          </div>
        </form>

        <form [formGroup]="formularioFuncion" style="margin-top: 16px;">
          <label class="section-label">Funciones</label>
          <div class="inline-form">
            <select class="poo-input" formControlName="nivelFuncion" style="width: 100px;">
              <option *ngFor="let item of listNivel2" [value]="item">{{item}}</option>
            </select>
            <select class="poo-input" formControlName="tipoFuncion" style="width: 100px;">
              <option *ngFor="let item of list2" [value]="item">{{item}}</option>
            </select>
            <input class="poo-input" formControlName="funcion" type="text" placeholder="Nombre" style="flex: 1;">
            <button type="button" class="btn-poo btn-poo-success btn-sm"
              [disabled]="formularioFuncion.pristine || formularioFuncion.invalid"
              (click)="agregarFuncion()">Agregar</button>
          </div>
        </form>

        <form [formGroup]="formularioHerencia" style="margin-top: 16px;">
          <label class="section-label">Herencia</label>
          <div class="inline-form">
            <select class="poo-input" formControlName="clases" style="flex: 1;">
              <option *ngFor="let item of clases" [value]="item.nombre">{{item.nombre}}</option>
            </select>
            <button type="button" class="btn-poo btn-poo-primary btn-sm"
              [disabled]="formularioHerencia.pristine || formularioHerencia.invalid"
              (click)="agregarHerencia()">Crear herencia</button>
          </div>
        </form>
      </div>
    </div>

    <div class="dialog-right">
      <h3 class="info-heading">Informaci&#243;n de la clase</h3>
      <div class="class-preview">
        <div class="class-header">{{nameClase}}</div>
        <div class="class-section">
          <div class="class-section-title">Atributos</div>
          <div class="class-member" *ngFor="let item of atributos">{{item}}</div>
          <div class="class-empty" *ngIf="atributos.length === 0">Sin atributos</div>
        </div>
        <div class="class-section">
          <div class="class-section-title">Funciones</div>
          <div class="class-member" *ngFor="let item of funciones">{{item}}</div>
          <div class="class-empty" *ngIf="funciones.length === 0">Sin funciones</div>
        </div>
      </div>
      <button class="btn-poo btn-poo-ghost" style="margin-top: 16px; width: 100%;" (click)="reiniciar()">
        <mat-icon style="font-size: 16px; height: 16px; width: 16px;">close</mat-icon> Cerrar
      </button>
    </div>
  </div>
</div>
