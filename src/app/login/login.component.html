<div class="login-page">
  <div class="login-container">
    <div class="login-brand">
      <img src="../../assets/imgs/medusaasLogo.png" alt="POOGraph" class="brand-logo">
      <h1 class="brand-title">POOGraph</h1>
      <p class="brand-subtitle">Aprende Programaci&#243;n Orientada a Objetos de forma visual e interactiva</p>
    </div>

    <div class="login-card">
      <form novalidate [formGroup]="logIn" (ngSubmit)="validateUser()">
        <h2 class="login-heading">
          <mat-icon style="vertical-align: middle; margin-right: 8px;">account_circle</mat-icon>Iniciar Sesi&#243;n
        </h2>

        <div class="field-group">
          <label class="field-label">Usuario</label>
          <input type="text" class="poo-input field-input" placeholder="Nombre de usuario" required="required"
            formControlName="usrName" />
          <p class="field-error" *ngIf="f['usrName'].errors?.['required'] && f['usrName'].touched">
            *Coloca el nombre del usuario
          </p>
        </div>

        <div class="field-group">
          <label class="field-label">Contrase&#241;a</label>
          <input type="password" class="poo-input field-input" placeholder="Contrase&#241;a" required="required"
            formControlName="passwd" />
          <p class="field-error" *ngIf="f['passwd'].errors?.['required'] && f['passwd'].touched">
            *Coloca la contrase&#241;a
          </p>
        </div>

        <p class="field-error" *ngIf="bandError" style="text-align: center;">
          *Usuario y/o contrase&#241;a incorrecta, int&#233;ntalo de nuevo...
        </p>

        <button type="submit" class="btn-poo btn-poo-primary login-btn" [disabled]="logIn.invalid">
          <mat-icon style="font-size: 18px; height: 18px; width: 18px;">login</mat-icon> Ingresar
        </button>

        <div class="login-divider">
          <span>&#191;No tienes cuenta?</span>
        </div>

        <button type="button" class="btn-poo btn-poo-ghost login-btn" routerLink="/register">
          <mat-icon style="font-size: 18px; height: 18px; width: 18px;">person_add</mat-icon> Crear cuenta
        </button>
      </form>
    </div>
  </div>
</div>
